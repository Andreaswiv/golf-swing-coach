# Local stack. Everything binds to 127.0.0.1 only, so nothing is reachable from your network.
# Videos and keypoints live in ./data (a bind mount shared by the API and the CV service).
name: golfcoach

services:
  db:
    image: postgres:16-alpine   # multi-arch (arm64 + amd64)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-golfcoach}
      POSTGRES_USER: ${POSTGRES_USER:-golfcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golfcoach_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golfcoach} -d ${POSTGRES_DB:-golfcoach}"]
      interval: 5s
      timeout: 3s
      retries: 20

  cv-service:
    build:
      context: ./cv-service
      args:
        POSE_MODEL_VARIANT: ${POSE_MODEL_VARIANT:-heavy}   # lite | full | heavy (see the Dockerfile)
    environment:
      DATA_DIR: /data
      MAX_PROCESS_DIM: ${MAX_PROCESS_DIM:-1280}
      NUM_POSES: ${NUM_POSES:-2}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      cv-service:
        condition: service_started   # the API retries until the CV service answers
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-golfcoach};Username=${POSTGRES_USER:-golfcoach};Password=${POSTGRES_PASSWORD:-golfcoach_dev}
      CvService__BaseUrl: http://cv-service:8000
      Storage__DataDir: /data
      Upload__MaxMegabytes: ${UPLOAD_MAX_MB:-500}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:
