server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Videos can be large; the API enforces the real limit.
    client_max_body_size 600m;

    # Keypoints and swing results are large, repetitive JSON. Video types are not listed: they are
    # already compressed and need byte-range requests to seek.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;  # the default of 1 leaves the keypoints file about 25% larger
    gzip_min_length 1024;
    gzip_types application/json application/problem+json application/javascript text/css image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;   # stream uploads instead of buffering them on disk
        proxy_buffering off;           # keeps video range responses snappy
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
